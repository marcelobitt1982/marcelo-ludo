<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Neon Ludo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MENU INICIAL -->
    <div id="menu-screen" class="menu-box">
        <h1>NEON <span class="highlight">LUDO</span></h1>
        <p>Escolha a quantidade de jogadores:</p>
        <button onclick="iniciarJogo(2)">2 Jogadores (1 vs 1 BOT)</button>
        <button onclick="iniciarJogo(3)">3 Jogadores (1 vs 2 BOTS)</button>
        <button onclick="iniciarJogo(4)">4 Jogadores (1 vs 3 BOTS)</button>
    </div>

    <!-- TELA DO JOGO -->
    <div id="game-screen" class="game-box" style="display: none;">
        <div class="header">
            <h2 id="turn-info">Vez de: <span id="player-name">Verde</span></h2>
        </div>

        <!-- Tabuleiro sobre ludo.jpg com alinhamento preciso -->
        <div class="board-frame">
            <div class="board" id="board">
                <!-- As células e peças serão injetadas exatamente nas posições corretas via JS -->
            </div>
        </div>

        <div class="controls-area">
            <!-- Dado 3D Realista com Pontos -->
            <div class="dice-scene" onclick="girarDado()">
                <div id="dice-cube" class="cube">
                    <div class="cube-face face-1"><span class="dot"></span></div>
                    <div class="cube-face face-2"><span class="dot"></span><span class="dot"></span></div>
                    <div class="cube-face face-3"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
                    <div class="cube-face face-4"><div class="dot-row"><span class="dot"></span><span class="dot"></span></div><div class="dot-row"><span class="dot"></span><span class="dot"></span></div></div>
                    <div class="cube-face face-5"><div class="dot-row"><span class="dot"></span><span class="dot"></span></div><div class="dot-row"><span class="dot"></span></div><div class="dot-row"><span class="dot"></span><span class="dot"></span></div></div>
                    <div class="cube-face face-6"><div class="dot-row"><span class="dot"></span><span class="dot"></span></div><div class="dot-row"><span class="dot"></span><span class="dot"></span></div><div class="dot-row"><span class="dot"></span><span class="dot"></span></div></div>
                </div>
            </div>
            <button id="btn-roll" onclick="girarDado()">GIRAR DADO</button>
        </div>
        <div id="status-msg">Gire o dado para iniciar a partida!</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
